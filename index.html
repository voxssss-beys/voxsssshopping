<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hanımın Market Listesi</title>
    <link rel="manifest" href="manifest.json">
    <style>
        :root { --primary: #ff8000; --bg: #f8f9fa; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); margin: 0; padding: 20px; display: flex; justify-content: center; }
        .app-card { background: white; width: 100%; max-width: 450px; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); padding: 20px; }
        h2 { text-align: center; color: var(--primary); margin-bottom: 25px; }
        
        .selector-group { display: flex; gap: 10px; margin-bottom: 20px; }
        select, input { flex: 1; padding: 12px; border: 2px solid #eee; border-radius: 10px; font-size: 16px; }
        button#add-btn { background: var(--primary); color: white; border: none; padding: 0 20px; border-radius: 10px; cursor: pointer; font-weight: bold; }

        .list-item { display: flex; justify-content: space-between; align-items: center; padding: 15px; border-bottom: 1px solid #eee; }
        .price-tag { font-weight: bold; color: #2ecc71; }
        .total-area { margin-top: 20px; padding-top: 20px; border-top: 3px dashed #eee; text-align: right; font-size: 1.2rem; }
        .delete-btn { color: #e74c3c; cursor: pointer; border: none; background: none; font-size: 1.2rem; }
    </style>
</head>
<body>

<div class="app-card">
    <h2>Market Sepetim 🛒</h2>

    <div class="selector-group">
        <select id="product-select">
            <option value="" disabled selected>Ürün Seçin...</option>
            <optgroup label="Temel Gıda">
                <option value="Süt" data-price="35.50">Süt (1L)</option>
                <option value="Ekmek" data-price="10.00">Ekmek</option>
                <option value="Yumurta" data-price="95.00">Yumurta (30'lu)</option>
            </optgroup>
            <optgroup label="Manav">
                <option value="Domates" data-price="25.00">Domates (Kg)</option>
                <option value="Muz" data-price="60.00">Muz (Kg)</option>
            </optgroup>
        </select>
        <button id="add-btn">Ekle</button>
    </div>

    <ul id="shopping-list" style="padding:0"></ul>

    <div class="total-area">
        <strong>Toplam: <span id="total-price">0.00</span> TL</strong>
    </div>
</div>

<script>
    const select = document.getElementById('product-select');
    const btn = document.getElementById('add-btn');
    const list = document.getElementById('shopping-list');
    const totalDisplay = document.getElementById('total-price');

    let basket = JSON.parse(localStorage.getItem('basket')) || [];

    function updateUI() {
        list.innerHTML = '';
        let total = 0;
        
        basket.forEach((item, index) => {
            total += parseFloat(item.price);
            const li = document.createElement('li');
            li.className = 'list-item';
            li.innerHTML = `
                <span>${item.name}</span>
                <div>
                    <span class="price-tag">${item.price} TL</span>
                    <button class="delete-btn" onclick="removeItem(${index})">×</button>
                </div>
            `;
            list.appendChild(li);
        });

        totalDisplay.innerText = total.toFixed(2);
        localStorage.setItem('basket', JSON.stringify(basket));
    }

    btn.onclick = () => {
        const selectedOption = select.options[select.selectedIndex];
        if (select.value) {
            basket.push({
                name: selectedOption.value,
                price: selectedOption.getAttribute('data-price')
            });
            updateUI();
        }
    };

    window.removeItem = (index) => {
        basket.splice(index, 1);
        updateUI();
    };

    updateUI();
</script>

</body>
</html>
